[project]
name = "minority-prophet-gate"
version = "0.1.1"
description = "Refuse manufactured consensus: count attested evidence roots, not voices. Proven copy-invariant."
authors = [{name = "James Siyuan He"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["multi-agent", "consensus", "provenance", "attestation", "guardrail"]

[project.urls]
Research = "https://github.com/Silentpartnercoding/minority-prophet"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minority_prophet*"]
