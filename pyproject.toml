[project]
name = "minority-prophet-gate"
version = "0.1.1"
description = "Refuse manufactured consensus: count attested evidence roots, not voices. Machine-checked copy invariance under the stated model."
authors = [{name = "James Siyuan He"}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["multi-agent", "consensus", "provenance", "attestation", "guardrail"]

[project.urls]
Research = "https://github.com/Silentpartnercoding/minority-prophet"
Feedback = "https://github.com/Silentpartnercoding/minority-prophet-gate/issues"

[project.scripts]
mp-gate = "minority_prophet.byom_cli:main"
releasewarden = "minority_prophet.release_warden:main"

[project.optional-dependencies]
releasewarden = ["PyJWT[crypto]>=2.8,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minority_prophet*"]
