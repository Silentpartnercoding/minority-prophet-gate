name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m minority_prophet.verify_multivalue
      - run: mp-gate attack --evidence examples/byom/messy-evidence.jsonl --policy examples/byom/policy.json
      - run: mp-gate shadow --events examples/byom/shadow-events.jsonl --policy examples/byom/policy.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv /tmp/mp-gate-clean
      - run: /tmp/mp-gate-clean/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/mp-gate-clean/bin/mp-gate --help
