name: releasewarden-dogfood

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install ReleaseWarden
        run: python -m pip install .
      - name: Wait for required evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          required='["test (3.10)","test (3.11)","test (3.12)","package","semgrep-cloud-platform/scan"]'
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${SUBJECT_SHA}/check-runs?filter=latest&per_page=100" \
              > /tmp/releasewarden-check-runs.json
            ready=$(jq --argjson required "$required" '
              [.check_runs[] | select(.name as $name | $required | index($name))]
              | group_by(.name)
              | map(sort_by(.id) | last)
              | (length == ($required | length))
                and all(.status == "completed")
            ' /tmp/releasewarden-check-runs.json)
            if [ "$ready" = true ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Required evidence did not complete before the bounded timeout." >&2
              exit 2
            fi
            sleep 10
          done
      - name: Build exact-commit evidence fixture
        env:
          REPOSITORY: ${{ github.repository }}
          SUBJECT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq '[.check_runs[]
            | select(.name == "test (3.10)"
                  or .name == "test (3.11)"
                  or .name == "test (3.12)"
                  or .name == "package"
                  or .name == "semgrep-cloud-platform/scan")
            | {name, status, conclusion, app_slug: .app.slug, check_run_id: .id, details_url}
          ] | group_by(.name) | map(sort_by(.check_run_id) | last)' \
            /tmp/releasewarden-check-runs.json > /tmp/releasewarden-live-checks.json
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg sha "$SUBJECT_SHA" \
            --arg run_id "$RUN_ID" \
            '{
              action: "requested",
              repository: {full_name: $repository, id: 1},
              installation: {id: 1},
              environment: "releasewarden-sandbox",
              sha: $sha,
              ref: $sha,
              deployment_callback_url: ("https://api.github.com/repos/" + $repository + "/actions/runs/" + $run_id + "/deployment_protection_rule")
            }' > /tmp/releasewarden-live-request.json
      - name: Evaluate live evidence with ReleaseWarden
        run: |
          python -m minority_prophet.release_warden simulate \
            --policy examples/releasewarden/policy.shadow.json \
            --payload /tmp/releasewarden-live-request.json \
            --checks /tmp/releasewarden-live-checks.json \
            | tee /tmp/releasewarden-decision.json
          test "$(jq -r .state /tmp/releasewarden-decision.json)" = approved
          test "$(jq -r .gate_action /tmp/releasewarden-decision.json)" = proceed
          test "$(jq -r .diagnostics.roots_for /tmp/releasewarden-decision.json)" = 2
      - name: Create non-secret receipt
        id: receipt
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          receipt="releasewarden-dogfood:${SUBJECT_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          {
            echo "## ReleaseWarden dogfood evaluation"
            echo
            echo "- Exact commit: \`$SUBJECT_SHA\`"
            echo "- Decision: approved / proceed"
            echo "- Independent roots: 2"
            echo "- Receipt: \`$receipt\`"
          } >> "$GITHUB_STEP_SUMMARY"

  harmless-deploy:
    needs: evaluate
    runs-on: ubuntu-latest
    environment: releasewarden-sandbox
    steps:
      - name: Record harmless deployment
        env:
          RECEIPT: ${{ needs.evaluate.outputs.receipt }}
        run: |
          {
            echo "## Harmless sandbox deployment"
            echo
            echo "No external system was changed."
            echo
            echo "Receipt: \`$RECEIPT\`"
          } >> "$GITHUB_STEP_SUMMARY"
